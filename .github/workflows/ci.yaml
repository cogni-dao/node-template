name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  NODE_VERSION: "22"
  NODE_ENV: test
  LITELLM_MASTER_KEY: build-key
  AUTH_SECRET: tNf5lFM9yMhdgwS5yeQB8Y2kmigblBqobkvI2XN2brg=
  SCHEDULER_API_TOKEN: test-scheduler-api-token-for-ci-min32chars
  BILLING_INGEST_TOKEN: test-billing-ingest-token-for-ci-min32ch
  INTERNAL_OPS_TOKEN: test-internal-ops-token-for-ci-min32
  DISCORD_BOT_TOKEN: test-discord-bot-token-for-ci
  POSTHOG_API_KEY: phc_test_key_for_ci
  POSTHOG_HOST: http://localhost:18000

# story.0052: the CI logic is one composite action, .github/actions/node-ci. node-template is its
# reference consumer and calls it by local path; every other node calls
# `cogni-dao/node-template/.github/actions/node-ci@<full commit SHA>` and keeps only this thin file.
# The job names below ARE the required status contexts (.cogni/repo-policy.json): a job that runs the
# action keeps its bare name, which a reusable workflow call would not (it reports `<caller> / <job>`).
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          # The classifier diffs a PR against its base, so it needs the merge base history.
          fetch-depth: 0

      - uses: ./.github/actions/node-ci
        with:
          lane: static
          node_version: ${{ env.NODE_VERSION }}

  # task.0138: the unit lane is the longest CPU-bound job (the app vitest suite alone is ~150s on 4 vCPU),
  # so node-template fans it over four runners. The required context `unit` is the plain gate job below,
  # which reports success only when every shard did. Each shard repeats install and build in parallel, so
  # the wall clock is setup plus a quarter of the suite. Other nodes keep a single `unit` job running the
  # action; the checker accepts both shapes.
  unit-shard:
    runs-on: ubuntu-latest
    strategy:
      # Let every shard finish: a red run then names all the failing slices, not the first.
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          # The classifier diffs a PR against its base, so it needs the merge base history.
          fetch-depth: 0

      - uses: ./.github/actions/node-ci
        with:
          lane: unit
          node_version: ${{ env.NODE_VERSION }}
          unit_shard: ${{ matrix.shard }}
          # Split this package's vitest files across the shards; the other packages are dealt out whole.
          unit_split_package: "@cogni/node-template-app"

  # The required check. `always()` so a failed, cancelled or skipped shard fails it rather than skipping
  # it (GitHub scores a skipped required check as success); the step asserts the aggregate shard result.
  unit:
    needs: [unit-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every unit shard passed
        env:
          SHARDS: ${{ needs.unit-shard.result }}
        run: test "$SHARDS" = success

  component:
    runs-on: ubuntu-latest # GitHub-hosted runners provide Docker for testcontainers
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          # The classifier diffs a PR against its base, so it needs the merge base history.
          fetch-depth: 0

      - uses: ./.github/actions/node-ci
        with:
          lane: component
          node_version: ${{ env.NODE_VERSION }}
          # node-template owns @cogni/work-items' Doltgres adapter, so the real engine gates it here and
          # not only in a fork (task.5199). Dolt branch semantics are invisible to the fake-SQL unit tests.
          doltgres_command: pnpm --filter @cogni/node-template-app test:doltgres

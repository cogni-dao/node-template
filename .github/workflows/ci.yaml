name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  NODE_VERSION: "22"
  NODE_ENV: test
  LITELLM_MASTER_KEY: build-key
  AUTH_SECRET: tNf5lFM9yMhdgwS5yeQB8Y2kmigblBqobkvI2XN2brg=
  SCHEDULER_API_TOKEN: test-scheduler-api-token-for-ci-min32chars
  BILLING_INGEST_TOKEN: test-billing-ingest-token-for-ci-min32ch
  INTERNAL_OPS_TOKEN: test-internal-ops-token-for-ci-min32
  DISCORD_BOT_TOKEN: test-discord-bot-token-for-ci
  POSTHOG_API_KEY: phc_test_key_for_ci
  POSTHOG_HOST: http://localhost:18000

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          # The classifier diffs a PR against its base; queue and main runs need no history.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # task.0127 AFFECTED_ON_PR_FULL_ON_QUEUE: on pull_request, run only what the diff can
      # break; merge_group and push always run everything. Scoping skips STEPS, never this
      # job, so the required context still reports. Any classifier error means full.
      - name: Classify CI scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: pnpm ci:scope

      - name: Install dependencies
        if: steps.scope.outputs.scope != 'docs-only'
        run: pnpm install --frozen-lockfile

      - name: Install pinned Foundry
        if: steps.scope.outputs.scope != 'docs-only'
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Verify publish-condition artifact and behavior
        if: steps.scope.outputs.scope != 'docs-only'
        run: pnpm --filter @cogni/cogni-contracts check:solidity

      - name: Build workspace packages
        if: steps.scope.outputs.scope != 'docs-only'
        run: pnpm packages:build

      # F2 (task.5198): `pnpm db:check` was wired into the local-only `pnpm check`
      # chain and into NO CI job, so the drift guard it fronts was decorative —
      # `use_when` could reach the schema TS while the committed Doltgres snapshot
      # still lacked the column and every required check stayed green. It runs here,
      # after the build, because check-generate-clean's doltgres lane resolves
      # @cogni-dao/knowledge-base through its `exports` -> dist, not src.
      - name: Database schema checks
        if: steps.scope.outputs.scope != 'docs-only'
        run: pnpm db:check

      - name: Type check
        if: steps.scope.outputs.scope != 'docs-only'
        run: pnpm typecheck

      - name: Workflow contract check
        if: steps.scope.outputs.scope != 'docs-only'
        run: pnpm check:workflow

      # bug.5254: the same schema and sovereign policy the deploy verb runs (passes 1 and 2),
      # plus the retired `secret_refs` refusal. Pass 3 (reserved, inherited and off-cluster keys)
      # is operator data and runs only at deploy.
      - name: Node declarations check
        if: steps.scope.outputs.scope != 'docs-only'
        run: pnpm check:declarations

      # Never scoped out. A docs-only PR runs only this: Markdown can break no build, type,
      # schema, workflow or declaration, so the one check a Markdown edit can fail is its
      # own reference policy. It needs only git and node, so it runs before any install.
      # story.0046: node-template Markdown lives in the hub. Fails on tracked Markdown outside
      # the bootstrap set and on any repo docs/ or work/ Markdown path reference.
      - name: Markdown references check
        run: pnpm check:markdown-refs

  unit:
    runs-on: ubuntu-latest
    # No `needs: static`: unit does its own install + packages:build and consumes
    # no artifact from static, so gating on it only serialized the fast gate onto
    # the critical path for a fail-fast the merge queue re-checks anyway. Running
    # in parallel with static drops the ci.yaml critical path to max(job).
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          # The classifier diffs a PR against its base; queue and main runs need no history.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # task.0127 AFFECTED_ON_PR_FULL_ON_QUEUE: on pull_request, run only what the diff can
      # break; merge_group and push always run everything. Scoping skips STEPS, never this
      # job, so the required context still reports. Any classifier error means full.
      - name: Classify CI scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: pnpm ci:scope

      - name: Install dependencies
        if: steps.scope.outputs.scope != 'docs-only'
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        if: steps.scope.outputs.scope != 'docs-only'
        run: pnpm packages:build

      # Full chain: merge_group, push and any PR the classifier cannot scope. An empty or
      # missing scope output lands here too, so a classifier failure never skips tests.
      - name: Unit + contract coverage tests
        if: steps.scope.outputs.scope != 'docs-only' && steps.scope.outputs.scope != 'affected'
        run: pnpm test:ci

      # PR-only: the curated `test` chain restricted to packages the diff changed or that
      # depend on a changed package. The merge queue re-runs the full chain above.
      - name: Unit tests (affected packages)
        if: steps.scope.outputs.scope == 'affected'
        env:
          UNIT_FILTERS: ${{ steps.scope.outputs.unit_filters }}
        run: pnpm test:affected

  component:
    # Required by .cogni/repo-policy.json on both pull_request and merge_group.
    # A required job must never disappear from a merge-queue candidate.
    runs-on: ubuntu-latest # GitHub-hosted runners provide Docker for testcontainers
    # No `needs: static` — component does its own install + build and shares no
    # artifact with static; running in parallel keeps it off the critical path.
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          # The classifier diffs a PR against its base; queue and main runs need no history.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # task.0127 AFFECTED_ON_PR_FULL_ON_QUEUE: on pull_request, run only what the diff can
      # break; merge_group and push always run everything. Scoping skips STEPS, never this
      # job, so the required context still reports. Any classifier error means full.
      - name: Classify CI scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: pnpm ci:scope

      - name: Install dependencies
        if: steps.scope.outputs.scope != 'docs-only'
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        if: steps.scope.outputs.scope != 'docs-only'
        run: pnpm packages:build

      # The repo/ripgrep-adapter component test shells out to `rg`; its adapter
      # ships in the scaffold, so the binary must be present (mirrors operator).
      - name: Install ripgrep
        if: steps.scope.outputs.scope != 'docs-only'
        uses: taiki-e/install-action@735e5933943122c5ac182670a935f54a949265c1 # v2
        with:
          tool: ripgrep

      - name: Verify ripgrep
        if: steps.scope.outputs.scope != 'docs-only'
        run: rg --version

      - name: Component tests (testcontainers)
        if: steps.scope.outputs.scope != 'docs-only'
        run: pnpm test:component

      # node-template owns `@cogni/work-items`' Doltgres adapter, so the real
      # engine must gate it here and not only in a fork (task.5199). Dolt branch
      # semantics are invisible to the fake-SQL unit tests.
      - name: Doltgres 0.57.3 work-item acceptance
        if: steps.scope.outputs.scope != 'docs-only'
        run: pnpm --filter @cogni/node-template-app test:doltgres

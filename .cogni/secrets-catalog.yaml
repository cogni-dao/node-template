# Per-node secrets catalog — node-domain (single-node-scope).
#
# This file is the ONE place a node declares a secret (bug.5254). Declare the
# SHAPE, NEVER the value. Each key lives at OpenBao `cogni/<env>/<slug>/<KEY>`.
# `workloads:` names the repo-spec services that receive it; a key with no
# `workloads` reaches no workload. Never list keys in repo-spec `secret_refs`.
# The runtime profile already supplies the standard app keys; do not repeat them.
#
# Two kinds of value:
#   - source: agent  + generate: { kind: hex|base64, bytes: N } + workloads —
#     when a release records, the operator creates it if absent (never rotated).
#     It does so only if the caller may manage this node's secrets; otherwise
#     the release waits on the missing key until a value exists.
#   - source: human  — you write it: POST /api/v1/nodes/<id>/secrets
#     (hub guide `node-self-serve-secrets`).
# Every entry needs `steps` (`[]` is fine). The deploy refuses an invalid file.
#
# This file ships empty. Add entries as your node needs them, e.g.:
#
# secrets:
#   - name: MY_SERVICE_TOKEN
#     tier: A2
#     source: agent
#     generate: { kind: hex, bytes: 32 }
#     workloads: [app]
#     required: true
#     category: "My service"
#     description: One line describing what consumes this key.
#     steps: []
#   - name: MY_VENDOR_API_KEY
#     tier: A2
#     source: human
#     workloads: [app]
#     required: true
#     category: "Vendor Name"
#     description: One line describing what consumes this key.
#     steps:
#       - "Create the key in the vendor dashboard."

secrets:
  - name: SERVICE_ENROLLMENT_ORIGIN
    tier: A2
    source: human
    workloads: [app]
    required: true
    category: Service enrollment
    description: Exact HTTPS origin served by this lane; no trailing path.
    steps:
      - "Required reads: https://node-template.cognidao.org/knowledge/node-service-enrollment and https://cognidao.org/knowledge/node-self-serve-secrets."

  - name: SERVICE_ENROLLMENT_ENVIRONMENT
    tier: A2
    source: human
    workloads: [app]
    required: true
    category: Service enrollment
    description: Exact deployment environment bound into signed service proofs.
    steps:
      - "Required reads: https://node-template.cognidao.org/knowledge/node-service-enrollment and https://cognidao.org/knowledge/node-self-serve-secrets."

  - name: SERVICE_ENROLLMENT_TRUSTED_HOMES
    tier: A2
    source: human
    workloads: [app]
    required: true
    category: Service enrollment
    description: Owner-reviewed JSON array of home tuples, signer kids and service scopes.
    steps:
      - "Required reads: https://node-template.cognidao.org/knowledge/node-service-enrollment and https://cognidao.org/knowledge/node-self-serve-secrets."

  - name: SERVICE_ENROLLMENT_SIGNING_JWK
    tier: A2
    source: human
    workloads: [app]
    required: true
    category: Service enrollment
    description: Private Ed25519 signing JWK held only by this node app.
    steps:
      - "Required reads: https://node-template.cognidao.org/knowledge/node-agent-key-lifecycle and https://cognidao.org/knowledge/node-self-serve-secrets."

  - name: SERVICE_ENROLLMENT_SIGNING_KID
    tier: A2
    source: human
    workloads: [app]
    required: true
    category: Service enrollment
    description: Public key id matching this lane signing JWK and remote trust configuration.
    steps:
      - "Required reads: https://node-template.cognidao.org/knowledge/node-service-enrollment and https://cognidao.org/knowledge/node-self-serve-secrets."

  - name: SERVICE_LINK_TARGETS
    tier: A2
    source: human
    workloads: [app]
    required: true
    category: Service enrollment
    description: Owner-reviewed JSON alias to full target tuple registry.
    steps:
      - "Required reads: https://node-template.cognidao.org/knowledge/node-service-enrollment and https://cognidao.org/knowledge/node-self-serve-secrets."

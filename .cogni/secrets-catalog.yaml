# Per-node secrets catalog — node-domain (single-node-scope).
#
# This file is the ONE place a node declares a secret (bug.5254). Declare the
# SHAPE, NEVER the value. Each key lives at OpenBao `cogni/<env>/<slug>/<KEY>`.
# `workloads:` names the repo-spec services that receive it; a key with no
# `workloads` reaches no workload. Never list keys in repo-spec `secret_refs`.
# The runtime profile already supplies the standard app keys; do not repeat them.
#
# Two kinds of value:
#   - source: agent  + generate: { kind: hex|base64, bytes: N } + workloads —
#     when a release records, the operator creates it if absent (never rotated).
#     It does so only if the caller may manage this node's secrets; otherwise
#     the release waits on the missing key until a value exists.
#   - source: human  — you write it: POST /api/v1/nodes/<id>/secrets
#     (hub guide `node-self-serve-secrets`).
# Every entry needs `steps` (`[]` is fine). The deploy refuses an invalid file.
#
# This file ships empty. Add entries as your node needs them, e.g.:
#
# secrets:
#   - name: MY_SERVICE_TOKEN
#     tier: A2
#     source: agent
#     generate: { kind: hex, bytes: 32 }
#     workloads: [app]
#     required: true
#     category: "My service"
#     description: One line describing what consumes this key.
#     steps: []
#   - name: MY_VENDOR_API_KEY
#     tier: A2
#     source: human
#     workloads: [app]
#     required: true
#     category: "Vendor Name"
#     description: One line describing what consumes this key.
#     steps:
#       - "Create the key in the vendor dashboard."

secrets:
  # The node AI's dedicated login wallet (task.0142). All optional: absent means the port is not built and nothing changes.
  # The wallet and its authorization key are NEVER the operator wallet's.
  - name: PRIVY_APP_ID
    tier: A2
    source: human
    workloads: [app]
    required: false
    category: "Privy"
    description: Privy app id the node AI login wallet lives in.
    steps:
      - "Copy the app id from the Privy dashboard."
  - name: PRIVY_APP_SECRET
    tier: A2
    source: human
    workloads: [app]
    required: false
    category: "Privy"
    description: Privy app secret for the node AI login wallet's app.
    steps:
      - "Copy the app secret from the Privy dashboard."
  - name: NODE_AI_WALLET_ADDRESS
    tier: A2
    source: human
    workloads: [app]
    required: false
    category: "Privy"
    description: Public address of the dedicated node AI login wallet. Must differ from the operator wallet.
    steps:
      - "Create a Privy server wallet for the node AI (not the operator wallet) and paste its address."
  - name: NODE_AI_WALLET_SIGNING_KEY
    tier: A2
    source: human
    workloads: [app]
    required: false
    category: "Privy"
    description: Privy authorization key that owns the node AI login wallet. Must differ from the operator's PRIVY_SIGNING_KEY.
    steps:
      - "Create a separate Privy authorization key, make it the owner of the node AI wallet, and paste its private key."

# Per-node secrets catalog — node-domain (single-node-scope).
#
# This file is the ONE place a node declares a secret (bug.5254). Declare the
# SHAPE, NEVER the value. Each key lives at OpenBao `cogni/<env>/<slug>/<KEY>`.
# `workloads:` names the repo-spec services that receive it; a key with no
# `workloads` reaches no workload. Never list keys in repo-spec `secret_refs`.
# The runtime profile already supplies the standard app keys; do not repeat them.
#
# Two kinds of value:
#   - source: agent  + generate: { kind: hex|base64, bytes: N } + workloads —
#     when a release records, the operator creates it if absent (never rotated).
#     It does so only if the caller may manage this node's secrets; otherwise
#     the release waits on the missing key until a value exists.
#   - source: human  — you write it: POST /api/v1/nodes/<id>/secrets
#     (hub guide `node-self-serve-secrets`).
# Every entry needs `steps` (`[]` is fine). The deploy refuses an invalid file.
#
# This file ships empty. Add entries as your node needs them, e.g.:
#
# secrets:
#   - name: MY_SERVICE_TOKEN
#     tier: A2
#     source: agent
#     generate: { kind: hex, bytes: 32 }
#     workloads: [app]
#     required: true
#     category: "My service"
#     description: One line describing what consumes this key.
#     steps: []
#   - name: MY_VENDOR_API_KEY
#     tier: A2
#     source: human
#     workloads: [app]
#     required: true
#     category: "Vendor Name"
#     description: One line describing what consumes this key.
#     steps:
#       - "Create the key in the vendor dashboard."

# Service enrollment (story.0038). The routes answer 503 until the values exist, so every entry is optional (`required: false`).
# Plain config is NOT declared here: this node's own origin and environment come from its typed config (APP_BASE_URL, DEPLOY_ENVIRONMENT).
secrets:
  # The only credential: 32 random bytes the operator mints once. The Ed25519 signing key pair and its kid are DERIVED from it
  # (app/src/bootstrap/service-enrollment-config.ts); the public key is served at /.well-known/jwks.json.
  - name: SERVICE_ENROLLMENT_SIGNING_SEED
    tier: A2
    source: agent
    generate: { kind: base64, bytes: 32 }
    workloads: [app]
    required: false
    category: Service enrollment
    description: Seed of the Ed25519 key this node signs service enrollment proofs with; the key pair and kid are derived from it.
    steps: []

  # Non-sensitive, lane-specific routing JSON (public tuples, public key ids, service scopes). The node has no per-lane config file, so the sanctioned
  # secrets API is the only way to deliver it per lane; the value holds no credential.
  - name: SERVICE_ENROLLMENT_TRUSTED_HOMES
    tier: A2
    source: human
    workloads: [app]
    required: false
    category: Service enrollment
    description: JSON array of the home nodes this node trusts to sign enrollment tokens (node id, environment, origin, signer kids, service scopes).
    steps:
      - "Required reads: https://node-template.cognidao.org/knowledge/node-service-enrollment and https://cognidao.org/knowledge/node-self-serve-secrets."

  - name: SERVICE_LINK_TARGETS
    tier: A2
    source: human
    workloads: [app]
    required: false
    category: Service enrollment
    description: JSON map from a link alias to the target node tuple (node id, environment, origin) this node may request a service from.
    steps:
      - "Required reads: https://node-template.cognidao.org/knowledge/node-service-enrollment and https://cognidao.org/knowledge/node-self-serve-secrets."

# Per-node secrets catalog — node-domain (single-node-scope).
#
# This file is the ONE place a node declares a secret (bug.5254). Declare the
# SHAPE, NEVER the value. Each key lives at OpenBao `cogni/<env>/<slug>/<KEY>`.
# `workloads:` names the repo-spec services that receive it; a key with no
# `workloads` reaches no workload. Never list keys in repo-spec `secret_refs`.
# The runtime profile already supplies the standard app keys; do not repeat them.
#
# Two kinds of value:
#   - source: agent  + generate: { kind: hex|base64, bytes: N } + workloads —
#     when a release records, the operator creates it if absent (never rotated).
#     It does so only if the caller may manage this node's secrets; otherwise
#     the release waits on the missing key until a value exists.
#   - source: human  — you write it: POST /api/v1/nodes/<id>/secrets
#     (hub guide `node-self-serve-secrets`).
# Every entry needs `steps` (`[]` is fine). The deploy refuses an invalid file.
#
# This file ships empty. Add entries as your node needs them, e.g.:
#
# secrets:
#   - name: MY_SERVICE_TOKEN
#     tier: A2
#     source: agent
#     generate: { kind: hex, bytes: 32 }
#     workloads: [app]
#     required: true
#     category: "My service"
#     description: One line describing what consumes this key.
#     steps: []
#   - name: MY_VENDOR_API_KEY
#     tier: A2
#     source: human
#     workloads: [app]
#     required: true
#     category: "Vendor Name"
#     description: One line describing what consumes this key.
#     steps:
#       - "Create the key in the vendor dashboard."

# Service assertions (story.0038). Every entry is optional (`required: false`): unset means no jwks route, no outbound signer and no trusted homes.
secrets:
  # The home's private signing key: an Ed25519 JWK as JSON ({"kty":"OKP","crv":"Ed25519","d":...,"x":...}). Its public half is served at /.well-known/jwks.json.
  - name: SERVICE_ASSERTION_SIGNING_JWK
    tier: A2
    source: human
    workloads: [app]
    required: false
    category: Service assertions
    description: Ed25519 private JWK (JSON) this node signs service assertions with; the public key is published at /.well-known/jwks.json.
    steps:
      - "Required read: https://node-template.cognidao.org/knowledge/node-service-enrollment and https://cognidao.org/knowledge/node-self-serve-secrets."
  - name: SERVICE_ASSERTION_SIGNING_KID
    tier: A2
    source: human
    workloads: [app]
    required: false
    category: Service assertions
    description: Key id of the signing key, published in the jwks and set as the kid header of every assertion.
    steps:
      - "Required read: https://node-template.cognidao.org/knowledge/node-service-enrollment and https://cognidao.org/knowledge/node-self-serve-secrets."
  - name: GITHUB_READ_TOKEN
    tier: A2
    source: human
    workloads: [app]
    required: false
    category: Service assertions
    description: Optional read-only GitHub token sent as a bearer on the org owner repo-spec read (lifts the unauthenticated rate limit); unset reads unauthenticated.
    steps:
      - "Required read: https://cognidao.org/knowledge/node-self-serve-secrets. Use a fine-grained token with read access to public repository contents only."
  - name: SERVICE_TRUSTED_HOMES
    tier: A2
    source: human
    workloads: [app]
    required: false
    category: Service assertions
    description: JSON array of { issuer, jwksUri, services } for the home nodes whose signed service assertions this node accepts.
    steps:
      - "Required read: https://node-template.cognidao.org/knowledge/node-service-enrollment and https://cognidao.org/knowledge/node-self-serve-secrets."

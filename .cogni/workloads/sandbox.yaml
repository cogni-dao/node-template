# Workload manifest (hub `workload-manifest`): this node's code-execution sandbox (OpenSandbox execd
# behind Caddy, services/sandbox) as its OWN lease, so a sandbox resize or re-mint never touches the app.
# It is a worker: the operator gives it ONLY the catalog keys whose `workloads` names `sandbox`
# (.cogni/secrets-catalog.yaml: SANDBOX_EXECD_TOKEN), never the app's database or auth secrets. GH_TOKEN is not a
# lease secret: the app passes a 1-hour token, minted from the node's own GitHub App, into each call.
# The app derives this origin from its own host (`node-template.cognidao.org` ->
# `node-template-sandbox.cognidao.org`; candidate-a `node-template-sandbox-test`), so the sandbox keeps a
# route on that host. Execd enforces the token on every request except /version and /readyz.
#
# `variables` are plain, committed values (never secrets): git identity and a credential helper that reads
# the call's GH_TOKEN at push time. Author name and email are display only. Design: hub `node-ai-push-token`.
#
# The image is node-template's standard sandbox (services/sandbox: execd, Node 22, pnpm, gh), pinned by
# digest: a worker's `image: .` would resolve to the app image. When services/sandbox changes, bump the
# digest to the ghcr.io/cogni-dao/node-template-sandbox image CI built for that commit.
apiVersion: score.dev/v1b1
metadata:
  name: sandbox
  annotations:
    cogni.dev/exclusive: "false"
    cogni.dev/ephemeral-storage: 10Gi
containers:
  sandbox:
    image: ghcr.io/cogni-dao/node-template-sandbox@sha256:2be482af45e49673b7fc42973cf8408d7497750593ef5153d4919092a1b4834e
    resources:
      requests:
        cpu: "2"
        memory: 4096Mi
    variables:
      GIT_AUTHOR_NAME: node-template AI
      GIT_AUTHOR_EMAIL: node-template@ai.cognidao.org
      GIT_COMMITTER_NAME: node-template AI
      GIT_COMMITTER_EMAIL: node-template@ai.cognidao.org
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: credential.https://github.com.helper
      GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8080
service:
  ports:
    web:
      port: 80
      targetPort: 8080
resources:
  web:
    type: route
    params:
      host: node-template-sandbox.cognidao.org
      path: /
      port: 80

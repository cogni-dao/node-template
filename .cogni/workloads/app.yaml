# Workload manifest (hub `workload-manifest`, story.5137): this node's app on the operator's
# node-deploy verb. `POST /api/v1/deploy/workloads {nodeId, env, workload: "app", sourceSha}`
# reads this file at sourceSha. Image "." = the image this repo's CI built at that sha.
# Runtime env and secrets come from the operator (OpenBao custody), never from this file.
# Each merge to main ships through that one verb (story.5127): build once, blue/green, exact SHA.
apiVersion: score.dev/v1b1
metadata:
  name: app
  annotations:
    cogni.dev/exclusive: "false"
    cogni.dev/ephemeral-storage: 4Gi
containers:
  app:
    image: .
    # Agent proof issues (task.0095): lowercase `owner/repo#number`, one list for both envs. Not a secret.
    # The operator reads the proof comment with its own GitHub App and signs it; this node holds no GitHub credential.
    # The entry of the other env is inert: the operator reads only its own org.
    variables:
      AGENT_PROOF_ISSUES: "cogni-dao/node-template#341,cogni-test-org/node-template#46"
    resources:
      requests:
        cpu: "2"
        memory: 2048Mi
    readinessProbe:
      httpGet:
        path: /readyz
        port: 3200
service:
  ports:
    web:
      port: 80
      targetPort: 3200
resources:
  web:
    type: route
    params:
      host: node-template.cognidao.org
      path: /
      port: 80
